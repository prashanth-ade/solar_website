spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/solarflow_web}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:Prashanth27@}
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
      max-concurrent-uploads: 5
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
app:
  jwtSecret: ${JWT_SECRET:development-local-jwt-secret-change-me}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}
  corsAllowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  payment:
    provider: ${PAYMENT_PROVIDER:stub}
    currency: ${PAYMENT_CURRENCY:INR}
  email:
    provider: ${EMAIL_PROVIDER:console}
  admin:
    email: ${APP_ADMIN_EMAIL:}
    password: ${APP_ADMIN_PASSWORD:}
server.port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
